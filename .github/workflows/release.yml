name: Build Brightside Film Remote

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mac-release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and test
        run: |
          npm ci
          npm run check

      - name: Build Apple Silicon app
        run: npm run dist:mac

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          APP_ZIP="$(find dist -maxdepth 1 -type f -name '*arm64-mac.zip' -print | head -n 1)"
          shasum -a 256 "$APP_ZIP" > "$APP_ZIP.sha256"
          gh release create "v$VERSION" "$APP_ZIP" "$APP_ZIP.sha256" --title "Brightside Film Remote $VERSION" --generate-notes
